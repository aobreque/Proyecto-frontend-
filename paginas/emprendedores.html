
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Registrar comercio | EcoRuta</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/comercios.css">
</head>
<body>
    <a href="#main-content" class="skip-link">Saltar al contenido principal</a>
    <p id="anuncios" class="sr-only" aria-live="polite"></p>

    <header>
        <div class="logo">
            <img src="../assets/imagenes/bus.v2.png" alt="" class="bus">
            <span>EcoRuta</span>
        </div>

        <search>
            <input type="search" id="buscar" placeholder="Buscar ruta o destino..." aria-label="Buscar ruta o destino">
            <button type="button" class="btn-buscar" aria-label="Buscar"></button>
        </search>

        <div class="accesibilidad" role="toolbar" aria-label="Accesibilidad">
            <button type="button" id="btn-letra-mas" aria-label="Aumentar tamaño de letra">A+</button>
            <button type="button" id="btn-letra-menos" aria-label="Disminuir tamaño de letra">A-</button>
            <button type="button" id="btn-modo-oscuro" aria-label="Alternar modo oscuro" aria-pressed="false">🌙</button>
        </div>

        <nav aria-label="Navegación principal">
            <ul class="menu">
                <li><a href="../index.html#inicio">Inicio</a></li>
                <li><a href="../index.html#servicios">Servicios</a></li>
                <li><a href="../index.html#quienes-somos">Quiénes somos</a></li>
                <li><a href="../index.html#contacto">Contacto</a></li>
            </ul>
        </nav>
    </header>

    <main id="main-content">
        <section class="registro-comercio">
            <h1>Registra tu comercio local</h1>

            <p>
                Forma parte de EcoRuta y da a conocer
                tu emprendimiento en La Araucanía.
            </p>

            <form id="form-comercio" novalidate>

    <!-- Nombre del comercio -->
    <label for="nombre">Nombre del comercio</label>
    <input
        type="text"
        id="nombre"
        name="nombre"
        placeholder="Ej: Eco Café Victoria"
        minlength="3"
        maxlength="100"
        required
    >

    <!-- Descripción -->
    <label for="descripcion">Descripción</label>
    <textarea
        id="descripcion"
        name="descripcion"
        placeholder="Ej: Cafetería con productos orgánicos y locales"
        minlength="10"
        maxlength="500"
        required
    ></textarea>

    <!-- Ciudad -->
    <label for="ciudad">Ciudad</label>
    <input
        type="text"
        id="ciudad"
        name="ciudad"
        placeholder="Ej: Victoria"
        required
    >

    <!-- Dirección -->
    <label for="direccion">Dirección</label>
    <input
        type="text"
        id="direccion"
        name="direccion"
        placeholder="Ej: Avenida Prat 123"
        required
    >

    <!-- Correo -->
    <label for="contacto">Correo de contacto</label>
    <input
        type="email"
        id="contacto"
        name="contacto"
        placeholder="Ej: contacto@ecocafe.cl"
        required
    >

    <!-- Botón de registro -->
    <button type="submit" id="btn-registrar">
        Registrar comercio
    </button>

    <!-- Mensajes de validación -->
    <p
        id="mensaje-formulario"
        role="status"
        aria-live="polite"
    ></p>

            </form>
        </section>
    </main>

    <script type="module" src="../js/main.js"></script>
    <script type="module" src="../js/comercios.js"></script>
    <script type="module" src="../js/busqueda.js"></script>
</body>
</html>
